name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
            bin: agy-hyper
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
            bin: agy-hyper
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: tar.gz
            bin: agy-hyper
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            bin: agy-hyper.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package plugin bundle (Unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/agy-hyper/bin
          cp -R plugin/. dist/agy-hyper/
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/agy-hyper/bin/
          chmod +x dist/agy-hyper/bin/${{ matrix.bin }}
          tar -czf agy-hyper-${{ matrix.target }}.tar.gz -C dist agy-hyper
      - name: Package plugin bundle (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/agy-hyper/bin | Out-Null
          Copy-Item -Recurse plugin/* dist/agy-hyper/
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.bin }} dist/agy-hyper/bin/
          foreach ($f in @("dist/agy-hyper/mcp_config.json", "dist/agy-hyper/hooks.json")) {
            (Get-Content -Raw $f) -replace '\./bin/agy-hyper(?![\w.])', './bin/agy-hyper.exe' | Set-Content -Path $f -NoNewline
          }
          Compress-Archive -Path dist/agy-hyper -DestinationPath agy-hyper-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.target }}
          path: agy-hyper-${{ matrix.target }}.${{ matrix.ext }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: cd artifacts && sha256sum agy-hyper-* > SHA256SUMS && cat SHA256SUMS
      - name: Attest build provenance (Sigstore / Cosign)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/agy-hyper-*
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/agy-hyper-*
            artifacts/SHA256SUMS
