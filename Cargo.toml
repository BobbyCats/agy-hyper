[workspace]
resolver = "2"
members = [
    "crates/hyper-core",
    "crates/hyper-daemon",
    "crates/hyper-cli",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"
authors = ["BobbyCats <https://github.com/BobbyCats>"]
repository = "https://github.com/BobbyCats/agy-hyper"
homepage = "https://github.com/BobbyCats/agy-hyper"
description = "Zero-dependency Rust acceleration engine, crash-safe WAL atomic edits, Tree-sitter semantic packing, and native telemetry cockpit for Antigravity."

[workspace.dependencies]
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
gix = { version = "0.70", default-features = false, features = ["status", "revision", "dirwalk", "max-performance-safe"] }
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
libc = "0.2"
notify = "8"
regex = "1.11"
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
